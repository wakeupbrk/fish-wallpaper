name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS executable
        run: |
          swiftc -parse-as-library -O -target arm64-apple-macos12.0 -framework AppKit -framework AVFoundation Aquarium.swift -o aquarium-arm64
          swiftc -parse-as-library -O -target x86_64-apple-macos12.0 -framework AppKit -framework AVFoundation Aquarium.swift -o aquarium-x64
          lipo -create aquarium-arm64 aquarium-x64 -output aquarium
          mkdir -p package/assets
          cp assets/* package/assets/
          cp aquarium package/aquarium
          chmod 755 package/aquarium
          package/aquarium --check
          tar -czf fish-wallpaper-macos-universal.tar.gz -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: fish-wallpaper-macos-universal
          path: fish-wallpaper-macos-universal.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Build and test Windows app
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm fish.spec
          .\dist\aquarium-fish\aquarium-fish.exe --check
          $env:QT_QPA_PLATFORM = 'offscreen'
          .\dist\aquarium-fish\aquarium-fish.exe --smoke
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw $errors[0] }
          Compress-Archive -Path .\dist\aquarium-fish -DestinationPath fish-wallpaper-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: fish-wallpaper-windows-x64
          path: fish-wallpaper-windows-x64.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop graphics libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxcb-image0 libxcb-keysyms1 libxcb-icccm4 libxcb-util1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxkbcommon-x11-0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Build and test Linux app
        run: |
          python -m PyInstaller --noconfirm fish.spec
          ./dist/aquarium-fish/aquarium-fish --check
          QT_QPA_PLATFORM=offscreen ./dist/aquarium-fish/aquarium-fish --smoke
          tar -czf fish-wallpaper-linux-x64.tar.gz -C dist aquarium-fish
      - uses: actions/upload-artifact@v4
        with:
          name: fish-wallpaper-linux-x64
          path: fish-wallpaper-linux-x64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fish-wallpaper-*
          merge-multiple: true
          path: release
      - name: Checksum packages
        run: |
          cd release
          sha256sum fish-wallpaper-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/fish-wallpaper-macos-universal.tar.gz
            release/fish-wallpaper-windows-x64.zip
            release/fish-wallpaper-linux-x64.tar.gz
            release/SHA256SUMS
